[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "silero-vad"
version = "6.2.3"
authors = [
  {name="Silero Team", email="hello@silero.ai"},
]
description = "Voice Activity Detector (VAD) by Silero"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "packaging",
  "torch>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/snakers4/silero-vad"
Issues = "https://github.com/snakers4/silero-vad/issues"

[project.optional-dependencies]
audio = [
    "torchaudio>=0.12.0,<2.10",
    # torchaudio >= 2.9 delegates decoding to torchcodec, so it is useless
    # without it. Both need Python >= 3.9; on 3.8 pip resolves torchaudio < 2.9,
    # which decodes on its own.
    "torchcodec; python_version>='3.9'",
]
codec = [
    # No torchcodec wheels exist for Python 3.8, so the marker keeps this extra
    # (and [all]) installable there instead of failing to resolve.
    "torchcodec; python_version>='3.9'",
]
onnx-cpu = [
    "onnxruntime>=1.16.1",
    "numpy",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.16.1",
    "numpy",
]
all = [
    "silero-vad[audio,codec,onnx-cpu]",
    "numpy",
]
test = [
    "silero-vad[audio]",
    "pytest",
    "soundfile",
    "torch<2.9",
]
