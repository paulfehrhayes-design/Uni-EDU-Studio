[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harry-botter-voice-service"
version = "0.1.0"
description = "Isolated local-first voice service foundation for Harry Botter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = [
    "av==18.1.0",
    "faster-whisper==1.1.0",
    "kokoro==0.7.4",
    "espeakng-loader==0.2.4",
    "numpy>=1.26,<3",
    "torch==2.7.1",
    "webrtcvad-wheels==2.0.14.post1",
    "websockets==15.0.1",
]
voice-design = [
    "qwen-tts==0.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
